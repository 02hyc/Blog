params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Yanchen Huang — Notes
  description: "Notes by Yanchen Huang on technology, learning, and things worth remembering."
  keywords: [Technology, Learning, Notes, Blog]
  author: Yanchen Huang
  # author: ["Me", "You"] # multiple authors
  DateFormat: "Jan 2, 2006"
  defaultTheme: light # dark, light
  disableThemeToggle: true

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  hideAuthor: true
  showtoc: false
  tocopen: false

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "favicon.ico"
    favicon16x16: "favicon-16x16.png"
    favicon32x32: "favicon-32x32.png"
    apple_touch_icon: "apple-touch-icon.png"
    safari_pinned_tab: "favicon-16x16.png"
    theme_color: "#ffffff"
    msapplication_TileColor: "#ffffff"

  schema:
    publisherType: Person
    sameAs:
      - "https://02hyc.github.io/"
      - "https://github.com/02hyc"
      - "https://www.linkedin.com/in/yanchen-huang-370334355/"

  label:
    text: "Yanchen Huang / Notes"
    # icon: /apple-touch-icon.png
    iconHeight: 35

  # profile-mode
  profileMode:
    enabled: false # needs to be explicitly set
    title: ExampleSite
    subtitle: "This is subtitle"
    imageUrl: "<img location>"
    imageWidth: 120
    imageHeight: 120
    imageTitle: my image
    buttons:
      - name: Posts
        url: posts
      - name: Tags
        url: tags

  # home-info mode
  homeInfoParams:
    Title: "Notes"
    Content: |
      Notes on technology, learning, and things worth remembering.

      关于技术、学习，以及一些值得记下来的事。
    Links:
      - label: "Homepage"
        url: "https://02hyc.github.io/"
      - label: "GitHub"
        url: "https://github.com/02hyc"
      - label: "LinkedIn"
        url: "https://www.linkedin.com/in/yanchen-huang-370334355/"
      - label: "RSS"
        url: "https://02hyc.github.io/Blog/index.xml"


  socialIcons:
    - name: github
      url: "https://github.com/02hyc"
    - name: linkedin
      url: "https://www.linkedin.com/in/yanchen-huang-370334355/"
    - name: rss
      url: "https://02hyc.github.io/Blog/index.xml"

  # analytics:
  #   google:
  #     SiteVerificationTag: "XYZabc"
  #   bing:
  #     SiteVerificationTag: "XYZabc"
  #   yandex:
  #     SiteVerificationTag: "XYZabc"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  # editPost:
  #   URL: "https://github.com/<path_to_repo>/content"
  #   Text: "Suggest Changes" # edit text
  #   appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]

  page:
    comments:
      enable: true
      giscus:
        enable: true
        repo: 02hyc/02hyc
        repoId: R_kgDOJNwc9Q
        category: Announcements
        categoryId: DIC_kwDOJNwc9c4ClwD9
        mapping: title

menu:
  main:
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 5
    - identifier: categories
      name: Topics
      url: /categories/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30
    - identifier: example
      name: Homepage
      url: https://02hyc.github.io/
      weight: 40

