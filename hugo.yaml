markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai
outputs:
  home:
  - html
  - rss
  - json
  section:
  - html
  - rss
  taxonomy:
  - html
  term:
  - html

services:
  disqus:
    shortname: 02hyc.disqus.com/admin
