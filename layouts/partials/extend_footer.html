{{- if and .IsPage (.Param "ShowToc") }}
<script>
  (function () {
    var toc = document.querySelector('.toc');
    if (!toc) return;
    var details = toc.querySelector('details');
    var wide = window.matchMedia('(min-width: 1280px)');
    var initiallyOpen = details.open;
    // The sidebar is always expanded; the inline TOC keeps its own open state.
    function sync() { details.open = wide.matches || initiallyOpen; }
    sync();
    wide.addEventListener('change', sync);

    var links = Array.prototype.slice.call(toc.querySelectorAll('a[href^="#"]'));
    var targets = links.map(function (a) {
      return document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
    });
    // Highlight the last heading that has scrolled past the top quarter of the viewport.
    function spy() {
      var line = window.innerHeight * 0.25, current = -1;
      targets.forEach(function (el, i) {
        if (el && el.getBoundingClientRect().top <= line) current = i;
      });
      links.forEach(function (a, i) { a.classList.toggle('active', i === current); });
    }
    var ticking = false;
    window.addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () { spy(); ticking = false; });
    }, { passive: true });
    spy();
  })();
</script>
{{- end }}
{{- if .IsPage }}
<script>
  // Mark table columns whose body cells are all numeric so CSS can right-align them.
  document.querySelectorAll('.post-content table:not(.highlighttable)').forEach(function (table) {
    var rows = Array.prototype.slice.call(table.rows);
    var body = rows.filter(function (r) { return r.parentNode.tagName === 'TBODY'; });
    var cols = rows.reduce(function (n, r) { return Math.max(n, r.cells.length); }, 0);
    var numeric = /^[\s$≥≤<>~+−-]*[\d.,]+\s*%?$/;
    for (var c = 1; c < cols; c++) {
      var isNum = body.length && body.every(function (r) {
        return r.cells[c] && numeric.test(r.cells[c].textContent.trim());
      });
      if (isNum) rows.forEach(function (r) { if (r.cells[c]) r.cells[c].classList.add('num'); });
    }
  });
</script>
