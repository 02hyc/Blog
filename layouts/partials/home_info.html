{{- with site.Params.homeInfoParams }}
<section class="notebook-intro" aria-labelledby="notebook-title">
    {{- with .Kicker }}
    <p class="notebook-kicker">{{ . }}</p>
    {{- end }}
    <h1 id="notebook-title">{{ .Title | markdownify }}</h1>
    <div class="notebook-description">
        {{ .Content | markdownify }}
    </div>
    <footer class="notebook-footer">
        {{- with .Topics }}
        <p class="notebook-topics">{{ . }}</p>
        {{- end }}
        {{- with .Links }}
        <nav class="notebook-links" aria-label="Yanchen Huang profile links">
            {{- range . }}
            <a href="{{ .url }}">{{ .label }}</a>
            {{- end }}
        </nav>
        {{- end }}
    </footer>
</section>
{{- end -}}
