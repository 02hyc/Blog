<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 36 950 340" aria-label="Evaluation signals placed on an idea's timeline. At time t, when the idea is proposed and no experiment has run: expert ratings [9, 10] and novelty checks [14]. After experiments run, weeks to months later: experimental outcomes [15] and hypothesis verification [16, 17]. When the paper is published: matching the published paper [5–8] and acceptance or reviews [11–13]. Months to years later: citations and awards [18, 19]. Earlier signals are noisy or partial; complete signals arrive only after the fact. Research taste means predicting, at t, what the community will say later." xmlns="http://www.w3.org/2000/svg" width="950" height="340"><style>
:root{--bg:#f4f3ec;--ink:#292d26;--mute:#8b8f84;--line:#cdd0c4;--acc:#b94228;--paper:#fbfaf5}
text{font-family:"Avenir Next","Helvetica Neue","PingFang SC",sans-serif;fill:var(--ink);font-size:14px}
.m{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;fill:var(--mute)}
.cap{font-size:10.5px;letter-spacing:.18em;fill:var(--mute)}
.lab{font-size:12px;fill:var(--mute)}
.name{font-size:15px;letter-spacing:.02em}
.goal{font-size:14px;letter-spacing:.02em;fill:var(--acc)}
.ln{fill:none;stroke:var(--line);stroke-width:1.2}

:root{--bg:transparent}
</style><title>Evaluation signals placed on an idea's timeline. At time t, when the idea is proposed and no experiment has run: expert ratings [9, 10] and novelty checks [14]. After experiments run, weeks to months later: experimental outcomes [15] and hypothesis verification [16, 17]. When the paper is published: matching the published paper [5–8] and acceptance or reviews [11–13]. Months to years later: citations and awards [18, 19]. Earlier signals are noisy or partial; complete signals arrive only after the fact. Research taste means predicting, at t, what the community will say later.</title><line x1="40" y1="150" x2="905" y2="150" class="ln"/><path d="M898 146L905 150L898 154" class="ln"/><text x="912" y="154" class="m" text-anchor="start">time</text><g><circle cx="130" cy="150" r="5.5" fill="rgb(251, 250, 245)" stroke="rgb(41, 45, 38)" stroke-width="1.4"/><text x="130" y="180" class="name" text-anchor="middle">Idea proposed</text><text x="130" y="198" class="m" text-anchor="middle">t · before any experiment</text></g><g><rect x="32" y="216" width="196" height="46" rx="6" fill="rgb(251, 250, 245)" stroke="rgb(205, 208, 196)" stroke-width="1.2"/><text x="130" y="236" class="" text-anchor="middle">Expert ratings</text><text x="130" y="252" class="m" text-anchor="middle">[9] [10]</text></g><g><rect x="32" y="272" width="196" height="46" rx="6" fill="rgb(251, 250, 245)" stroke="rgb(205, 208, 196)" stroke-width="1.2"/><text x="130" y="292" class="" text-anchor="middle">Novelty check</text><text x="130" y="308" class="m" text-anchor="middle">[14]</text></g><g><circle cx="360" cy="150" r="5.5" fill="rgb(251, 250, 245)" stroke="rgb(41, 45, 38)" stroke-width="1.4"/><text x="360" y="180" class="name" text-anchor="middle">Experiments run</text><text x="360" y="198" class="m" text-anchor="middle">weeks to months</text></g><g><rect x="262" y="216" width="196" height="46" rx="6" fill="rgb(251, 250, 245)" stroke="rgb(205, 208, 196)" stroke-width="1.2"/><text x="360" y="236" class="" text-anchor="middle">Experimental outcome</text><text x="360" y="252" class="m" text-anchor="middle">[15]</text></g><g><rect x="262" y="272" width="196" height="46" rx="6" fill="rgb(251, 250, 245)" stroke="rgb(205, 208, 196)" stroke-width="1.2"/><text x="360" y="292" class="" text-anchor="middle">Hypothesis verification</text><text x="360" y="308" class="m" text-anchor="middle">[16] [17]</text></g><g><circle cx="590" cy="150" r="5.5" fill="rgb(251, 250, 245)" stroke="rgb(41, 45, 38)" stroke-width="1.4"/><text x="590" y="180" class="name" text-anchor="middle">Paper published</text><text x="590" y="198" class="m" text-anchor="middle">peer review</text></g><g><rect x="492" y="216" width="196" height="46" rx="6" fill="rgb(251, 250, 245)" stroke="rgb(205, 208, 196)" stroke-width="1.2"/><text x="590" y="236" class="" text-anchor="middle">Match the published paper</text><text x="590" y="252" class="m" text-anchor="middle">[5]–[8]</text></g><g><rect x="492" y="272" width="196" height="46" rx="6" fill="rgb(251, 250, 245)" stroke="rgb(205, 208, 196)" stroke-width="1.2"/><text x="590" y="292" class="" text-anchor="middle">Acceptance &amp; reviews</text><text x="590" y="308" class="m" text-anchor="middle">[11]–[13]</text></g><g><circle cx="820" cy="150" r="5.5" fill="rgb(251, 250, 245)" stroke="rgb(41, 45, 38)" stroke-width="1.4"><animate attributeName="fill" values="rgb(251, 250, 245);rgb(247, 246, 241);rgb(220, 220, 214);rgb(72, 75, 69);rgb(45, 49, 42);rgb(41, 45, 38);rgb(41, 45, 38);rgb(45, 49, 42);rgb(72, 75, 69);rgb(220, 220, 214);rgb(247, 246, 241);rgb(251, 250, 245);rgb(251, 250, 245)" keyTimes="0.00000;0.00741;0.01481;0.02963;0.03704;0.04444;0.15556;0.16296;0.17037;0.18519;0.19259;0.20000;1" dur="4.5s" repeatCount="indefinite"/></circle><text x="820" y="180" class="name" text-anchor="middle">Community response</text><text x="820" y="198" class="m" text-anchor="middle">months to years</text></g><g><rect x="722" y="216" width="196" height="46" rx="6" fill="rgb(25